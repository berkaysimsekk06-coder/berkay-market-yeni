<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Berkay Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f5f5f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { color: #f27a1a; margin-bottom: 20px; font-size: 26px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; outline: none; font-size: 14px; }
        .input-group input:focus { border-color: #f27a1a; }
        .login-btn { width: 100%; background: #f27a1a; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .login-btn:hover { background: #d96813; }
        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #f27a1a; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>BERKAY MARKET</h2>
        <p style="color: #888; font-size: 14px; margin-bottom: 25px;">Hesabınıza giriş yapın</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>E-Posta Adresi</label>
                <input type="email" placeholder="ornek@email.com" required>
            </div>
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" placeholder="********" required>
            </div>
            <button type="submit" class="login-btn">Giriş Yap</button>
        </form>

        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            alert("Giriş başarılı! Ana sayfaya yönlendiriliyorsunuz.");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
